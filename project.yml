name: RolleiMeter
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RolleiMeter:
    type: application
    platform: iOS
    sources:
      - path: RolleiMeter
    info:
      path: RolleiMeter/Info.plist
      properties:
        CFBundleDisplayName: RolleiMeter
        NSCameraUsageDescription: The camera is used to measure light.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
    settings:
      base:
        # Overridden by the workflow with your BUNDLE_ID secret.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rolleimeter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
