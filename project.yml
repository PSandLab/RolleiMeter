name: RolleiMeter
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  RolleiMeter:
    type: application
    platform: iOS
    sources:
      - path: RolleiMeter
    info:
      path: RolleiMeter/Info.plist
      properties:
        CFBundleDisplayName: RolleiMeter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - GeistMono-SemiBold.ttf
          - GeistMono-Bold.ttf
          - GeistSerif-Regular.ttf
        NSCameraUsageDescription: The camera is used to measure light and capture reference frames for your film logbook.
        NSLocationWhenInUseUsageDescription: Location is used to tag GPS coordinates onto logged film frames and EXIF metadata.
        NSPhotoLibraryAddUsageDescription: Allows saving tagged film scans and reference frames to your Photo Library.
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
    settings:
      base:
        # Overridden by the workflow with your BUNDLE_ID secret.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rolleimeter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
