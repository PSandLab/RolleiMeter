name: Build IPA

# Builds an UNSIGNED .ipa. Sign it with your own signer.
# Build on changes to main as well as on demand, so SDK/toolchain regressions are caught.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle ID baked into the app (your signer may rewrite it)
        type: string
        default: com.example.rolleimeter

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select and verify current Xcode toolchain
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
          echo "Selected iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive without signing
        env:
          APP_BUNDLE_ID: ${{ inputs.bundle_id || 'com.example.rolleimeter' }}
        run: |
          set -euo pipefail
          if [[ ! "$APP_BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "Invalid bundle identifier: $APP_BUNDLE_ID"
            exit 1
          fi
          xcodebuild archive \
            -project RolleiMeter.xcodeproj \
            -scheme RolleiMeter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RolleiMeter.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/RolleiMeter.xcarchive/Products/Applications/RolleiMeter.app"
          test -d "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry RolleiMeter.ipa Payload)
          rm -rf build/Payload
          ls -la build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RolleiMeter-ipa
          path: build/RolleiMeter.ipa
          if-no-files-found: error
